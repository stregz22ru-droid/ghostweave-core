site_name: GHOSTWEAVE
site_description: Trust Layer for AI-Driven Systems
site_url: https://ghostweave.io

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Protocol: protocol.md
  - SDK: sdk.md
  - Certification: certification.md
  - ADR: adr/
  - Governance: governance.md
  - Release Policy: release-policy.md

repo_url: https://github.com/stregz22ru-droid/ghostweave-core-v1
repo_name: ghostweave-core-v1

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search